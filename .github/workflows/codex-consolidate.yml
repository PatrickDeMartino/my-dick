name: Consolidate complete site

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/codex-consolidate.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete source and public assets
        shell: bash
        run: |
          set -euo pipefail
          cp -R .codex-upload/source/. .
          cat .codex-upload/pnpm/*.bin > pnpm-lock.yaml

          base="https://planet-urf-v1.kind-daisy-3040.chatgpt.site"
          mkdir -p public/dog-fighting/assets public/media
          curl -fsSL --retry 3 "$base/dog-fighting/arena.jpg" -o public/dog-fighting/arena.jpg
          curl -fsSL --retry 3 "$base/dog-fighting/assets/index-C6Ek0MLA.js" -o public/dog-fighting/assets/index-C6Ek0MLA.js
          curl -fsSL --retry 3 "$base/dog-fighting/assets/index-CkSpTFet.css" -o public/dog-fighting/assets/index-CkSpTFet.css
          curl -fsSL --retry 3 "$base/dog-fighting/favicon.svg" -o public/dog-fighting/favicon.svg
          curl -fsSL --retry 3 "$base/dog-fighting/rat-meat-bridge.js" -o public/dog-fighting/rat-meat-bridge.js
          curl -fsSL --retry 3 "$base/media/cia-seal.svg" -o public/media/cia-seal.svg
          curl -fsSL --retry 3 "$base/media/rat-meat-can-v2.png" -o public/media/rat-meat-can-v2.png
          curl -fsSL --retry 3 "$base/media/rat-meat-can.jpg" -o public/media/rat-meat-can.jpg
          curl -fsSL --retry 3 "$base/penguinaroo.png" -o public/penguinaroo.png
          curl -fsSL --retry 3 "$base/vicheal-nic.jpg" -o public/vicheal-nic.jpg

          sha256sum -c <<'CHECKSUMS'
          f437e07d18d953c703e705611851204f74a67c64c13283fd4e643565b161c351  public/dog-fighting/arena.jpg
          bf3640fcdfe92caaaae164fa801d8675dc62421bb5c77985360c45f0cf64440a  public/dog-fighting/assets/index-C6Ek0MLA.js
          c77d44ed9c779efedec2dbb857054f0752785cbfffe107d4f5ff9d8d4d6cc53f  public/dog-fighting/assets/index-CkSpTFet.css
          d06f484e9d76e787ca136024da2f13327001cb14b6bd503f7ec1adecdd80af31  public/dog-fighting/favicon.svg
          bb8bca703b06a4370dff54c45f25e4d42eaa1bdbb86d03203999dfd6436ae8e7  public/dog-fighting/rat-meat-bridge.js
          7bac6ea2ef9e35142d1d7f145b6407ef8ea84b49c2dc855fdec703c5dff8394d  public/media/cia-seal.svg
          4dbd14847e99ac86f36badd7d5880e341b90e15e0f10de4f27608cf3ad01b3b1  public/media/rat-meat-can-v2.png
          18ab241625ce1b12ecd2be3bfc51a8e24bc54377c98f371b40afc7c5ca7792cf  public/media/rat-meat-can.jpg
          43227eab70d00bbec93181134e26574dbdf4ffa77f0dfb14ae592e1ba62da5a2  public/penguinaroo.png
          b2214086fd315b6c4205077771b1959715dcb81a2d54be0d05eb38762cab4847  public/vicheal-nic.jpg
          CHECKSUMS

          rm -rf .codex-upload
          rm -f .github/workflows/codex-consolidate.yml

      - name: Publish consolidated repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add -A
          git commit -m "Consolidate complete TripTotropic site"
          git push origin HEAD:main
